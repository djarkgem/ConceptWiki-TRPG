name: Build ConceptWiki APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unpack ConceptWiki source
        run: |
          rm -rf project
          mkdir project
          unzip -q source-bundle.zip -d project
          echo "=== Project ==="
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          sdkmanager --version || true

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build ConceptWiki APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload ConceptWiki APK
        uses: actions/upload-artifact@v4
        with:
          name: ConceptWiki-TRPG-0.2-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
