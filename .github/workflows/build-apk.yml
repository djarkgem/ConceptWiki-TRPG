name: Build ConceptWiki APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unpack ConceptWiki source
        run: |
          rm -rf project
          mkdir project
          unzip -q source-bundle.zip -d project
          echo "=== Project contents ==="
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          echo "=== Platforms ==="
          ls -la "$ANDROID_HOME/platforms" || true
          echo "=== Build tools ==="
          ls -la "$ANDROID_HOME/build-tools" || true
          echo "=== NDK ==="
          ls -la "$ANDROID_HOME/ndk" || true
          echo "=== CMake ==="
          ls -la "$ANDROID_HOME/cmake" || true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build ConceptWiki APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find project -type f -name "*.apk" -print

      - name: Upload ConceptWiki APK
        uses: actions/upload-artifact@v4
        with:
          name: ConceptWiki-TRPG-0.2-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
